  hv.setAttribute('x',m.l+i*bw);hv.setAttribute('opacity',.1);tt.innerHTML=`<b>${D.days[i]}</b><br>${hin[i]+oth[i]} calls · Hindi ${hin[i]}`;tt.style.display='block';
  const hr=host.getBoundingClientRect();tt.style.left=Math.min(Math.max(e.clientX-hr.left-40,0),hr.width-130)+'px';tt.style.top='0px'};
 svg.addEventListener('pointermove',mv);svg.addEventListener('pointerdown',mv);svg.addEventListener('pointerleave',()=>{tt.style.display='none';hv.setAttribute('opacity',0)})}
/* ----- tips ----- */
function tips(c,x,a,h,langs){const T=[],tot=sum(a),y=a[N-1],b7=avg(a.slice(-7)),best=Math.max(...a),bi=a.indexOf(best),hs=sum(h)/Math.max(tot,1);
 const goal=Math.max(Math.ceil(b7*1.2),y+1,3);
 let streak=0;for(let i=N-1;i>=0&&a[i]>0;i--)streak++;let idle=0;for(let i=N-1;i>=0&&a[i]==0;i--)idle++;
 if(idle>=2)T.push(['⏰','Start again today',`No calls for ${idle} days. Even 5 calls today restarts your streak. Your best day was ${best} calls on ${D.days[bi]}.`]);
 else if(y<b7*.7&&b7>0)T.push(['📉','Yesterday was below your usual',`You made ${y} calls yesterday against a usual ${f(b7)}. Try to make up the gap today: aim for ${goal}.`]);
 else if(y>=best&&best>0)T.push(['🏆','Yesterday was your best day!',`${y} calls, your highest so far. Hold this level for a week and your total grows fast.`]);
 else T.push(['🎯',`Today's target: ${goal} calls`,`Your last-7-day average is ${f(b7)} and your best day is ${best}. A little above your average each day adds up fast.`]);
 if(streak>=3)T.push(['🔥',`${streak}-day streak`,`You have called every day for ${streak} days in a row. Do not break it.`]);
 const wd=a.map((v,i)=>[v,i]).filter(([v,i])=>isSun(D.dnum[i]));if(wd.length&&sum(wd.map(x=>x[0]))<avg(a)*wd.length*.7&&tot>20)T.push(['📅','Sundays are slow for you','Your Sunday calls are much lower than other days. Plan a few extra calls on Sunday to keep your daily average up.']);
 const hr=c.hr,ht=sum(hr);if(ht>=15){const bh=hr.indexOf(Math.max(...hr)),mor=sum(hr.slice(7,12)),eve=sum(hr.slice(15,22));
  T.push(['🕒',`Your best time is ${hrl(bh)}–${hrl(bh+1)}`,`${Math.round(hr[bh]/ht*100)}% of your calls happen in that hour.`+(mor/ht<.15?' Very few calls happen before noon. Calling people in the morning (7 to 11 am) adds easy extra calls.':eve/ht<.25?' Evenings (3 to 10 pm) are when most people are free: try to call more in that window.':'')])}
 if(tot>=20&&hs<.8){const ol=langs.filter(l=>!HIN.includes(l[0])).sort((p,q)=>q[1]-p[1])[0];T.push(['🗣️','Push Hindi calls',`Only ${Math.round(hs*100)}% of your calls are in Hindi. Hindi calls are the focus right now.`+(ol?` Your ${ol[0]} calls are strong (${f(ol[1])}); ask your Hindi-speaking contacts too.`:'')])}
 if(c.nq>0&&c.nq/c.n>.03)T.push(['✅','Make sure calls are recorded',`${c.nq} of your ${f(c.n)} calls (${Math.round(c.nq/c.n*100)}%) did not qualify because the recording was missing. Keep the call going for the full conversation and check the recording is on.`]);
 else if(c.n>=20)T.push(['✅','Great recording quality',`${Math.round((1-c.nq/c.n)*100)}% of your calls qualified. Keep it up.`]);
 const nx=Object.values(D.codes).filter(o=>o.n>c.n).sort((p,q)=>p.n-q.n)[0];
 if(nx&&c.r>1)T.push(['📈',`Move up from #${c.r}`,`Only ${f(nx.n-c.n)} more calls to overtake the next code. At ${f(Math.max(b7,1))} a day that is ${Math.ceil((nx.n-c.n)/Math.max(b7,1))===1?'about 1 day':Math.ceil((nx.n-c.n)/Math.max(b7,1))+' days'}.`]);
 if(tot<10)T.push(['🌱','Getting started','Share your referral code with more people and ask each of them to make a call. Every call adds to your count.']);
 return T}
/* ----- page ----- */
function show(code){const c=D.codes[code],a=c.a,h=c.h,tot=sum(a),y=a[N-1],b7=avg(a.slice(-7)),best=Math.max(...a),bi=a.indexOf(best),oth=a.map((v,i)=>v-h[i]);
 const langs=Object.entries(c.l).filter(([l])=>!SKIP.includes(l)).map(([l,v])=>[l,sum(v),v[N-1],sum(v.slice(-3))]).sort((p,q)=>q[1]-p[1]);const mxl=Math.max(...langs.map(l=>l[1]),1);
 const act=a.filter(v=>v>0).length,qual=c.n?Math.round((1-c.nq/c.n)*100):0,P=c.n>=1;
 let H=`<div class="card hero"><div class="code">${code}${c.t?' · '+c.t:''}</div><div class="big" id="bg">${f(tot)}</div><small>total calls till ${D.days[N-1]}</small><br><span class="rk">🏅 Rank ${c.r} of ${D.n} codes</span></div>
 <div class="card"><div class="g"><div class="tile"><b>${y}</b><span>Yesterday</span></div><div class="tile"><b>${f(b7)}</b><span>Daily avg (7 days)</span></div><div class="tile"><b>${best}</b><span>Best day · ${D.dnum[bi]} Nov</span></div><div class="tile"><b>${f(sum(h))}</b><span>Hindi calls</span></div></div>
 <p class="sub" style="margin:10px 0 0">Active on ${act} of ${N} days · ${qual}% of calls qualified</p></div>
 <div class="card"><h2>💡 Tips to improve your count</h2><p class="sub">Based on your own calls</p><div class="tips">${tips(c,c,a,h,langs).map(t=>`<div class="tip"><div class="e">${t[0]}</div><div><b>${t[1]}</b><span>${t[2]}</span></div></div>`).join('')}</div></div>
 <div class="card"><h2>📊 Calls per day</h2><p class="sub">Tap a bar to see the numbers</p><div id="ch" class="chart"></div></div>
 <div class="card"><h2>🗣️ Language-wise count</h2><p class="sub">Calls by language</p>${langs.map(l=>`<div class="lg"><div class="r"><b>${l[0]}</b><b>${f(l[1])}</b></div><div class="bar"><i style="width:0" data-w="${l[1]/mxl*100}"></i></div><div class="r"><span>${Math.round(l[1]/Math.max(tot,1)*100)}% of calls</span><span>Yesterday ${l[2]} · last 3 days ${l[3]}</span></div></div>`).join('')}</div>
 <div class="card"><h2>🗓️ Day-wise count</h2><p class="sub">Newest first. Orange rows are Sundays.</p><div class="tw"><table><tr><th>Date</th><th>Total</th><th>Hindi</th><th>Other</th><th></th></tr>${a.map((v,i)=>i).reverse().map(i=>{const v=a[i],p=i?a[i-1]:null,d=p==null?'':v>p?`<span class="up">▲ ${v-p}</span>`:v<p?`<span class="dn">▼ ${p-v}</span>`:'–';return `<tr class="${isSun(D.dnum[i])?'sun':''}"><td>${WD[new Date(2026,10,D.dnum[i]).getDay()]} ${D.dnum[i]} Nov</td><td><b>${v}</b></td><td>${h[i]}</td><td>${oth[i]}</td><td>${d}</td></tr>`}).join('')}<tr><td><b>Total</b></td><td><b>${f(tot)}</b></td><td><b>${f(sum(h))}</b></td><td><b>${f(sum(oth))}</b></td><td></td></tr></table></div></div>`;
 out.innerHTML=H;chart($('ch'),h,oth);
 requestAnimationFrame(()=>requestAnimationFrame(()=>out.querySelectorAll('.bar i').forEach(i=>i.style.width=i.dataset.w+'%')));
 const bg=$('bg');if(!matchMedia('(prefers-reduced-motion:reduce)').matches){const t0=performance.now(),st=n=>{const k=Math.min((n-t0)/900,1);bg.textContent=f(tot*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)}}
function home(){const r=(store('recent')||'').split(',').filter(x=>x&&D.codes[x]);
 out.innerHTML=`<div class="empty"><div class="e">👆</div><p>Start typing your referral code above, then tap it in the list.</p>${r.length?`<p style="font-size:13px">Recently viewed</p><div class="recent">${r.map(c=>`<button data-c="${c}">${c}</button>`).join('')}</div>`:''}</div>`;
 out.querySelectorAll('.recent button').forEach(b=>b.onclick=()=>pick(b.dataset.c))}
$('ft').innerHTML=`Counts are updated every morning with the previous day's calls · data up to ${D.upto}<br><a href="dashboard.html">Team lead dashboard →</a>`;
addEventListener('hashchange',()=>{const c=decodeURIComponent(location.hash.slice(1)).toUpperCase();D.codes[c]?(q.value=c,show(c)):home()});
const c0=decodeURIComponent(location.hash.slice(1)).toUpperCase();D.codes[c0]?(q.value=c0,show(c0)):home();
