<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hindi Calls Dashboard</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#16202e;--mut:#64708a;--line:#e3e8f0;--blue:#2f6fed;--org:#f08a24;--teal:#12a594;--grn:#16a34a;--red:#e5484d;--amb:#e0a100;--hero1:#1d3a8a;--hero2:#2f6fed;--shade:rgba(240,138,36,.10);--soft:#eef3ff}
@media(prefers-color-scheme:dark){:root{--bg:#0e1420;--card:#172033;--ink:#e8edf6;--mut:#92a0ba;--line:#26334c;--blue:#6b9bff;--org:#ffa24d;--teal:#3fd0bd;--grn:#4ade80;--red:#ff7a7f;--amb:#f5c542;--hero1:#16296b;--hero2:#2a58c9;--shade:rgba(255,162,77,.12);--soft:#1d2a45}}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:linear-gradient(120deg,var(--hero1),var(--hero2));color:#fff;padding:16px 16px 14px}
header h1{margin:0;font-size:20px;letter-spacing:.2px}header p{margin:3px 0 0;font-size:13px;opacity:.88}
.pill{display:inline-block;background:rgba(255,255,255,.18);border-radius:20px;padding:2px 10px;font-size:12px;margin-right:6px}
nav{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);display:flex;gap:6px;padding:8px 12px;overflow-x:auto;box-shadow:0 2px 8px rgba(0,0,0,.05)}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:22px;padding:8px 15px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;transition:.15s}
nav button:hover{border-color:var(--blue)}nav button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
main{max-width:1120px;margin:0 auto;padding:14px 14px 40px}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 1px 3px rgba(20,30,60,.04)}
.card h2{margin:0 0 2px;font-size:16px}.sub{color:var(--mut);font-size:13px;margin:0 0 10px}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(120deg,var(--hero1),var(--hero2));color:#fff;border:0;flex-wrap:wrap}
.hero .big{font-size:44px;font-weight:800;line-height:1.05}.hero small{opacity:.85;font-size:13px}.hero .txt{flex:1;min-width:210px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px}.tile b{display:block;font-size:22px;line-height:1.2}.tile span{color:var(--mut);font-size:12.5px}
.tile.acc{border-left:4px solid var(--blue)}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;position:relative}.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--blue),var(--teal));transition:width .6s}
.bar u{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--org);border-radius:2px}
.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600}
.ok{background:rgba(22,163,74,.15);color:var(--grn)}.warn{background:rgba(224,161,0,.18);color:var(--amb)}.bad{background:rgba(229,72,77,.15);color:var(--red)}.info{background:var(--soft);color:var(--blue)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{padding:8px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child,.l{text-align:left}
th{font-size:12px;color:var(--mut);font-weight:600}th.s{cursor:pointer}th.s:hover{color:var(--blue)}tr.sun td{background:var(--shade)}tr.today td{background:var(--soft);font-weight:700}tr.mile td{box-shadow:inset 0 -2px 0 var(--org)}
tr.row{cursor:pointer}tr.row:hover td{background:var(--soft)}.tw{overflow-x:auto}
.chart{position:relative;margin-top:6px}.chart svg{width:100%;height:auto;display:block;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:9px;font-size:12.5px;display:none;z-index:5;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.leg{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.leg button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:3px 10px;font-size:12.5px;cursor:pointer}.leg button.off{opacity:.4}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
input,select{font:inherit;font-size:14px;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}.seg button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.seg button:first-child{border-radius:9px 0 0 9px}.seg button:last-child{border-radius:0 9px 9px 0}.seg button.on{background:var(--blue);border-color:var(--blue);color:#fff}
.heat{display:grid;grid-template-columns:54px repeat(24,1fr);gap:2px;font-size:10px}.heat div{height:19px;border-radius:3px}.heat .h{height:auto;text-align:center;color:var(--mut)}.heat .r{height:19px;line-height:19px;color:var(--mut);font-size:11px}
.acts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}.act{display:flex;gap:10px;background:var(--soft);border-radius:12px;padding:11px}.act .n{flex:0 0 28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;text-align:center;line-height:28px;font-weight:700;font-size:14px}
.act b{display:block}.act span{font-size:13.5px;color:var(--ink)}
.help{font-size:13px;color:var(--mut);background:var(--soft);border-radius:10px;padding:8px 11px;margin:8px 0}
details{margin-top:12px}summary{cursor:pointer;color:var(--blue);font-weight:600}
.tcard{cursor:pointer;transition:.15s;border-left:5px solid var(--c)}.tcard:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,30,60,.12)}
footer{color:var(--mut);font-size:12px;text-align:center;padding:16px}
.ring{flex:0 0 96px}.ring text{fill:#fff}

details.lang{cursor:pointer}details.lang summary{list-style:none;color:var(--ink);font-weight:400}details.lang summary::-webkit-details-marker{display:none}details.lang summary>b{display:block;font-size:20px}
details.lang .hint{display:block;margin-top:6px;font-style:normal;font-size:12px;color:var(--blue);font-weight:600}details.lang[open]{grid-column:1/-1;box-shadow:0 8px 22px rgba(20,30,60,.12)}details.lang[open] .hint{display:none}
.ld{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;cursor:default}.lsum{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}.lsum>div{background:var(--soft);border-radius:10px;padding:6px 4px;text-align:center}.lsum b{display:block;font-size:16px}.lsum span{font-size:11px;color:var(--mut)}
.ld .tw{max-height:260px;overflow-y:auto}
/* ---- motion + mobile layer ---- */
header{background:linear-gradient(120deg,var(--hero1),var(--hero2),var(--hero1));background-size:220% 100%;animation:flow 14s ease-in-out infinite alternate;position:relative;overflow:hidden}
header:after,.hero:after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 68%);animation:float 9s ease-in-out infinite alternate;pointer-events:none}
.hero{position:relative;overflow:hidden;background-size:220% 100%;animation:flow 14s ease-in-out infinite alternate;box-shadow:0 10px 26px rgba(29,58,138,.28)}
@keyframes flow{to{background-position:100% 0}}@keyframes float{to{transform:translate(-26px,22px) scale(1.15)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}}@keyframes fade{from{opacity:0}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}.hero.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both,flow 14s ease-in-out infinite alternate}
.gb{transform-box:fill-box;transform-origin:50% 100%;animation:grow .65s cubic-bezier(.2,.8,.2,1) both}.gl{animation:fade .9s .25s ease both}
.bar i{transition:width 1s cubic-bezier(.2,.8,.2,1)}.ring circle{transition:stroke-dasharray 1.3s cubic-bezier(.2,.8,.2,1)}
.card,.tile{transition:transform .2s,box-shadow .2s}.card:hover,.tile:hover{box-shadow:0 8px 22px rgba(20,30,60,.10)}
nav button{display:flex;align-items:center;gap:6px}nav .ic{font-size:15px}nav .ls{display:none}
nav button.on{box-shadow:0 4px 12px rgba(47,111,237,.35)}
.flt .row2{display:flex;gap:8px;flex:1 1 auto}.flt .row2 select{flex:1;min-width:0}.flt .q{flex:1 1 220px;min-width:0}
.so{display:none}.seg{display:flex;overflow-x:auto;gap:6px;max-width:100%;-webkit-overflow-scrolling:touch}.seg button{border-radius:20px!important;white-space:nowrap}.seg em{font-style:normal;opacity:.7;margin-left:3px;font-size:11.5px}
.meta{font-size:12.5px;color:var(--mut);margin:0 0 6px}
.cl{display:grid;gap:10px}
.cc{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c,var(--blue));border-radius:14px;padding:12px;cursor:pointer;box-shadow:0 1px 3px rgba(20,30,60,.05);animation:rise .35s cubic-bezier(.2,.8,.2,1) both;transition:transform .15s,box-shadow .15s}
.cc:active{transform:scale(.985)}.cc.open{box-shadow:0 8px 22px rgba(20,30,60,.14)}
.cc .ct{display:flex;align-items:center;gap:8px}.cc .code{font-size:18px;letter-spacing:.3px}.cc .tm{font-size:12px;color:var(--mut);flex:1}.cc .chip{font-size:12px}
.cc .pg{margin:9px 0 4px}.cc .pg small{display:block;margin-top:4px;color:var(--mut);font-size:12.5px}
.cc .st4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.cc .st4>div{background:var(--soft);border-radius:10px;padding:6px 4px;text-align:center}.cc .st4 b{display:block;font-size:16px;line-height:1.2}.cc .st4 span{font-size:11px;color:var(--mut)}
.cc .st4 .g{background:var(--blue)}.cc .st4 .g b,.cc .st4 .g span{color:#fff}
.cc .cd{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;cursor:default}.cc .more2{font-size:12.5px;color:var(--mut)}
.mre{text-align:center}.mre button{margin-top:12px;border:1px solid var(--blue);background:transparent;color:var(--blue);border-radius:22px;padding:10px 22px;font:inherit;font-weight:600;cursor:pointer}
.stk{position:sticky;top:0;z-index:6;background:var(--card);padding:8px 0}
details.how{margin-top:10px}
@media(max-width:700px){
 body{padding-bottom:calc(74px + env(safe-area-inset-bottom))}
 header{padding:14px 14px 12px}header h1{font-size:19px}
 nav{position:fixed;top:auto;bottom:0;left:0;right:0;border-top:1px solid var(--line);border-bottom:0;box-shadow:0 -4px 16px rgba(0,0,0,.10);padding:6px 4px calc(6px + env(safe-area-inset-bottom));gap:2px;overflow:visible}
 nav button{flex:1;flex-direction:column;gap:1px;border:0;border-radius:12px;padding:6px 2px;font-size:11px;min-width:0}
 nav .ic{font-size:20px}nav .lf{display:none}nav .ls{display:inline}nav button.on{background:var(--soft);color:var(--blue);box-shadow:none}
 main{padding:10px 10px 24px}.card{padding:12px;border-radius:16px}
 .hero{padding:16px}.hero .big{font-size:38px}.ring{flex:0 0 78px;width:78px}
 .tile b{font-size:20px}.grid{gap:10px}.so{display:block}.seg button{padding:7px 13px;font-size:13.5px}
 input,select{font-size:16px;padding:10px 12px}
 .flt{gap:8px}.stk{margin:0 -4px;padding:8px 4px}
 th,td{padding:7px 6px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

 h+=`<div class="card" style="margin-top:12px"><h2>Language targets</h2><p class="sub">Tap a language to see its day-by-day counts. Counts are all calls in that language${r.langs.some(x=>x.lang=='Telugu')?' (Telugu: this team only)':''}.</p><div class="grid g3 langs" style="margin-top:8px">${r.langs.map((x,i)=>`<details class="tile lang" data-i="${i}"><summary><b>${x.lang}</b><div style="margin:6px 0">${bar(x.done/x.target)}</div><span>${f(x.done)} / ${f(x.target)} · needs <b>${f(x.perday)}</b>/day</span><em class="hint">Tap for daily counts ▾</em></summary><div class="ld"></div></details>`).join('')}</div></div>
 <div class="grid g2" style="margin-top:12px"><div class="card"><h2>⏰ When calls happen</h2><p class="sub">Average Hindi calls in each hour of the day.</p><div id="th"></div></div><div class="card"><h2>Day × hour map</h2><p class="sub">Darker = more calls. Hover for numbers.</p><div class="heat" id="hm"></div></div></div>
 <div class="card" style="margin-top:12px"><h2>✅ What to do today</h2><div class="acts" style="margin-top:8px">${act.map((a,i)=>`<div class="act"><div class="n">${i+1}</div><div><b>${a[0]}</b><span>${a[1]}</span></div></div>`).join('')}</div></div>`;
 return h}
function mount_team(T){const r=D.teams[T],col=COL[T];planMount('t',r,col);
 codeTable(document.getElementById('ct'),mkRows(r.top,T),{});
 document.querySelectorAll('details.lang').forEach(el=>el.addEventListener('toggle',()=>{if(!el.open||el.dataset.done)return;el.dataset.done=1;const x=r.langs[+el.dataset.i],box=el.querySelector('.ld'),dl=x.daily,tot=dl.reduce((p,c)=>p+c,0);
  const days=dl.map((v,i)=>[i,v]).reverse();
  box.innerHTML=`<div class="lchart"></div><div class="lsum"><div><b>${f(tot)}</b><span>total</span></div><div><b>${f(dl[dl.length-1])}</b><span>yesterday</span></div><div><b>${f(Math.max(...dl))}</b><span>best day</span></div><div><b>${f(avg(dl.slice(-7)))}</b><span>7-day avg</span></div></div><div class="tw"><table><tr><th>Day</th><th>Calls</th><th>Total so far</th></tr>${days.map(([i,v])=>`<tr class="${isSun(D.dnum[i])?'sun':''}"><td>${D.days[i]}</td><td><b>${f(v)}</b></td><td>${f(dl.slice(0,i+1).reduce((p,c)=>p+c,0))}</td></tr>`).join('')}</table></div>`;
  mkChart(box.querySelector('.lchart'),{x:D.dnum,tl:i=>D.days[i],h:170,shade:D.dnum.map((n,i)=>isSun(n)?i:-1).filter(i=>i>=0),bars:[{n:x.lang+' calls',c:col,v:dl}],hlines:[{v:x.perday,label:'needs '+f(x.perday)+'/day'}]})}));
 mount('th',{x:Array.from({length:24},(_,i)=>i),tl:i=>i+':00–'+(i+1)+':00',h:200,bars:[{n:'Avg Hindi calls',c:col,v:r.hourAvg}],fmt:v=>f(v)});
 const mx=Math.max(...r.heat.flat(),1);let s='<div></div>'+Array.from({length:24},(_,i)=>`<div class="h">${i%3==0?i:''}</div>`).join('');
 r.heat.forEach((row,d)=>{s+=`<div class="r">${D.days[d].split(' ').slice(0,2).join(' ')}</div>`+row.map((v,h)=>`<div title="${D.days[d]} ${h}:00 → ${v} calls" style="background:${col};opacity:${.07+.93*v/mx}"></div>`).join('')});document.getElementById('hm').innerHTML=s}
function codesPage(){return `<div class="card"><h2>All referral codes (${D.codes.length})</h2><p class="sub">Every code with Hindi calls, all three teams. Search, filter, sort, and tap a row.</p><div id="ca"></div></div>`}
function mount_codes(){const rows=D.codes.flatMap(c=>mkRows([{code:c[0],hindi:c[2],daily:c[4]}],c[1]));codeTable(document.getElementById('ca'),rows,{search:1,teams:1})}
/* ---------- motion helpers ---------- */
const REDUCE=matchMedia('(prefers-reduced-motion:reduce)').matches;
function fxBars(root){root.querySelectorAll('.bar i').forEach(i=>{const w=i.style.width;if(REDUCE)return;i.style.width='0%';requestAnimationFrame(()=>requestAnimationFrame(()=>i.style.width=w))})}
function fx(root){
 root.querySelectorAll('.card,.tile,.act,.tcard').forEach((e,i)=>{e.classList.add('rise');e.style.animationDelay=Math.min(i*40,520)+'ms'});
 fxBars(root);
 root.querySelectorAll('circle[data-d]').forEach(c=>requestAnimationFrame(()=>requestAnimationFrame(()=>c.style.strokeDasharray=c.dataset.d)));
 if(REDUCE)return;
 root.querySelectorAll('.big,.tile b').forEach(e=>{if(e.firstElementChild)return;const m=e.textContent.match(/^([^\d]*)([\d,]+(?:\.\d+)?)(.*)$/);if(!m)return;
  const v=parseFloat(m[2].replace(/,/g,'')),dec=(m[2].split('.')[1]||'').length,t0=performance.now(),D0=900;
  const step=now=>{const k=Math.min((now-t0)/D0,1),e3=1-Math.pow(1-k,3);e.textContent=m[1]+(v*e3).toLocaleString('en-IN',{minimumFractionDigits:dec,maximumFractionDigits:dec})+m[3];if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
/* ---------- router ---------- */
const TABS=[['ov','Overview','🏠','Home'],['CR','Craftzens','🟦','Craftzens'],['WB','ParisevaOne','🟧','Pariseva'],['OD','mDigital-OD','🟩','OD'],['codes','All codes','🔎','Codes']];
function go(k){location.hash=k;}
function render(keep){let k=location.hash.slice(1);if(!TABS.some(t=>t[0]==k))k='ov';
 document.getElementById('nav').innerHTML=TABS.map(t=>`<button class="${t[0]==k?'on':''}" onclick="go('${t[0]}')"><span class="ic">${t[2]}</span><span class="lf">${t[1]}</span><span class="ls">${t[3]}</span></button>`).join('');
 const m=document.getElementById('main');m.innerHTML=k=='ov'?overview():k=='codes'?codesPage():team(k);
 if(k=='ov')mount_overview();else if(k=='codes')mount_codes();else mount_team(k);fx(m);if(!keep)scrollTo(0,0);const on=document.querySelector('nav button.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'})}
document.getElementById('hsub').innerHTML=`<span class="pill">Data up to ${D.days[N-1]}</span><span class="pill">${REM} days left</span><span class="pill">Target by 30 Nov</span>`;
let _b=innerWidth<520?1:innerWidth<700?2:3,_t;addEventListener('resize',()=>{clearTimeout(_t);_t=setTimeout(()=>{const b=innerWidth<520?1:innerWidth<700?2:3;if(b!=_b){_b=b;render(1)}},250)});
addEventListener('hashchange',()=>render());render();
